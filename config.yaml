# Globalni prag: obavijest stiže kad je cijena ispod ove vrijednosti (EUR).
threshold: 28.0

# Kamo slati obavijesti. ntfy.sh je besplatan i ne traži registraciju:
# instaliraj aplikaciju "ntfy" na mobitel i pretplati se na isti topic.
# Topic se postavlja kao GitHub secret NTFY_TOPIC (repo je javan, pa ga
# ne upisuj ovdje). Za lokalno pokretanje: NTFY_TOPIC=... python price_tracker.py
notify:
  ntfy_topic: ""
  ntfy_server: "https://ntfy.sh"

# Proizvodi koje pratiš. Za većinu webshopova dovoljan je samo URL –
# cijena se automatski čita iz schema.org / meta podataka stranice.
# Ako shop to nema, dodaj "selector" (CSS selektor elementa s cijenom).
products:
  - name: "Pampers Premium Care Jumbo Pack S6 (50 kom)"
    url: "https://bazzar.hr/p/RZK49VX-pampers-premium-care-jumbo-pack-s6-50ct"

  # Primjer s vlastitim pragom i CSS selektorom (ako automatsko čitanje ne uspije):
  # - name: "Neki proizvod"
  #   url: "https://www.nekishop.hr/proizvod/123"
  #   selector: ".product-price .amount"
  #   threshold: 15.0
