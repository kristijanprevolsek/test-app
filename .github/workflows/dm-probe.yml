name: dm proba (privremeno)
on:
  push:
    branches: [claude/webshop-price-tracker-j8vys8]
    paths: [.github/workflows/dm-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sS -m 20 -A "$UA" -H "Accept: application/json" -o d.json "https://products.dm.de/product/products/detail/HR/dan/3068388"
          echo "=== kljucevi"; jq -c 'keys' d.json
          echo "=== putanje do cijena"; jq -c 'paths(scalars) as $p | select($p | map(tostring) | join(".") | test("price|Price|eyecatcher|Eyecatcher|promotion|Promotion|coupon")) | [($p|map(tostring)|join(".")), getpath($p)]' d.json | head -60
          echo "=== gtin/dan/title"; jq -c '{dan, gtin, title, brand: .brand.name}' d.json
          echo "=== cijeli JSON (skraceno)"; jq -c 'del(.descriptionGroups)' d.json | head -c 4000
