name: Provjera cijena

on:
  schedule:
    - cron: "17 * * * *"   # svakih sat vremena
  workflow_dispatch:        # ručno pokretanje iz kartice Actions

permissions:
  contents: write           # za spremanje state.json natrag u repo

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Provjeri cijene
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python price_tracker.py
      - name: Spremi stanje
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Ažuriraj stanje cijena" && git push)
